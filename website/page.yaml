  - id: usage
    tag: Usage
    title: Images in your shell
    blocks:
      - shell: |
          # Quick preview of any image in your terminal
          cati photo.jpg

          # High-resolution sextant rendering
          cati -m six diagram.png

          # Stream animated GIF or video
          cati play animation.gif

  # 3. How it was built
  - id: story
    tag: Engineering
    title: "The Engineering Story: Managing Agents with Guardrails"
    blocks:
      - text: |
          Cati is a prime case study in **governing autonomous AI development with strong
          verification gates**. Over a six-week period, the repository recorded **255 commits, 27
          PR merges, and 65 Go test files** across 38,200 lines of Go.
      - callout:
          tone: violet
          text: >-
            **Guardrail in Practice:** An AI optimization is only accepted if parity checks prove the
            output remains visually and mathematically identical to the reference path.
      - text: |
          ### 1. The Geometry Snapping Trap

          In late September, user options for width, height, aspect behavior, and padding had
          drifted into conflicting rules between the static image pipeline and the media player.
          Agents working on aspect ratio fixes inadvertently caused pixel-aspect distortions on
          non-square fonts.

          **The Fix:** Rather than patching ad-hoc formulas, we specified a centralized *Geometry
          Planner* (Issue 075). The team created an interactive aspect test matrix with 24 test
          cases. The planner snaps to native subcell lattices, enforces alignment padding, and
          scales row heights relative to terminal character metrics.

          ### 2. High-Performance Closed-Form Sextant Math

          Rendering high-resolution sextant glyphs originally used brute-force per-mask pixel
          scoring, which choked frame rates on terminal video playback. Working with
          `google-labs-jules[bot]` and local Harnez workers, the scoring loop was replaced with a
          **closed-form error calculation and lookup tables**, coupled with early exits for
          sparkline candidate searches.

          **Measured Result:** A **40% reduction in sextant render latency** and a **27.3% latency
          reduction for S2** mode. Strict parity benchmarks guaranteed zero visual regressions.

  # 4. How it is verified
  - id: verification
    tag: Verification
    title: Verification & Invariants
    blocks:
      - facts:
          - key: Test Coverage
            value: 65 Go test files covering CLI regressions, PTY escape parsing, and color error math.
          - key: Headless PTY Canaries
            value: Automated pseudo-terminal canaries verify ANSI cursor positions and reset sequences.
          - key: Parity Benchmarks
            value: Benchmarks test both throughput and visual mismatch against reference renderers.
          - key: Compliance
            value: 100% REUSE 3.3 compliant (SPDX AGPL-3.0-or-later).
      - gallery:
          - title: Works in restricted shells
            caption: >-
              cati rendering the site's pixel-art portrait at 10, 20 and 30 columns inside a Plesk
              chroot SSH shell on shared web hosting: no image protocol, only Unicode blocks and ANSI
              colors.
            images:
              - src: assets/cati-plesk-chroot-proof.png
                alt: Terminal screenshot of cati rendering a pixel-art portrait at three widths inside a Plesk chroot SSH session

  # 5. How to use it
  - id: install
    tag: Install
    title: Getting Started
    blocks:
      - text: "Install the three commands via Go (requires Go 1.26 or newer):"
      - shell: |
          go install ubunatic.com/cati/cmd/cati@latest
          go install ubunatic.com/cati/cmd/catiplay@latest
          go install ubunatic.com/cati/cmd/catibrowse@latest
      - text: "Or clone the repository and build locally:"
      - shell: |
          git clone https://codeberg.org/ubunatic/cati.git
          cd cati
          make build
          ./cati testdata/checkerboard_4x4.png
