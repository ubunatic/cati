  # 1. The problem
  - id: why
    tag: Why cati
    title: Why cati?
    blocks:
      - text: |
          An image in a terminal sounds simple: sample pixel colors, pick a character, and emit ANSI
          escape codes. In practice, the hard part is **preserving image fidelity while respecting
          the rigid geometry of a text cell grid**.

          Each terminal character cell can encode two vertical pixel rows with half-blocks (`▀`,
          `▄`), four subpixels with quadrant blocks (`▖`, `▗`, `▘`, `▝`), or six subpixels with
          Unicode sextants. Cati was engineered to bridge this gap cleanly: combining raster
          decoding, SVG rendering, and video playback into a single, inspectable Go CLI and
          reusable rendering library.
      - callout:
          text: >-
            **The Engineering Goal:** Accurate pixel aspect ratio snapping and fast rendering across
            Tilix, Kitty, Foot, Ptyxis, Alacritty, and the Linux VT.

  # 2. What it does, with the renders as evidence
  - id: renders
    tag: Capabilities
    title: Capabilities & Render Modes
    blocks:
      - cards:
          - badge: "▀▄"
            title: Subcell Block Geometry
            text: >-
              Supports half-block (1×2), quadrant (2×2), sextant (2×3), and 3×3 composite modes.
              Dynamically balances color error against spatial resolution.
          - badge: "▦"
            title: Pure Geometry Planner
            text: >-
              Unifies width, height, aspect preservation, and alignment padding across both static
              images and streaming video playback. Backed by a 24-case verification matrix.
          - badge: ">_"
            title: CLI, Player & Library
            text: >-
              Use it as a shell command (`cati image.png`), a directory viewer, or import
              `ubunatic.com/cati` as an in-process renderer in your Go TUI applications.
      - text: |
          ### Orig, half, quad, spark

