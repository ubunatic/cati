# Exact, case-sensitive named unions. A name is resolved before '+' grammar.
composition_order: [full, half, quad, quad+, bars, bars+, six, 2x3, 3x3, all, all+, z, z+]
compositions:
  f: [0]
  full: [0]
  1x1: [0]
  h: [0, 2]
  half: [0, 2]
  1x2: [0, 2]
  q: [0, 1, 2, 4]
  quad: [0, 1, 2, 4]
  Q: [0, 1, 2, 4, 14, 15]
  quad+: [0, 1, 2, 4, 14, 15]
  b: [0, 1, 2, 4, 44]
  bars: [0, 1, 2, 4, 44]
  B: [0, 1, 2, 4, 86]
  bars+: [0, 1, 2, 4, 86]
  x: [0, 1, 2, 4, 6]
  six: [0, 1, 2, 4, 6]
  6: [0, 1, 6]
  2x3: [0, 1, 6]
  9: [0, 1, 6, 9]
  3x3: [0, 1, 6, 9]
  a: [0, 1, 2, 4, 6, 9]
  all: [0, 1, 2, 4, 6, 9]
  A: [0, 1, 2, 4, 6, 9, 44]
  all+: [0, 1, 2, 4, 6, 9, 44]
  z: [0, 1, 2, 4, 6, 9, 86]
  Z: [0, 1, 2, 4, 6, 9, 88]
  z+: [0, 1, 2, 4, 6, 9, 88]
