cycle:
  - 2x4
  - full
  - half
  - quad
  - quad+
  - bars
  - bars+
  - six
  - 2x3
  - 3x3
  - octant
  - vec6
  - all
  - all+
  - z
  - z+

smart:
  metric: psnr
  max_reduction: 0.10
  step: native
  tie_break: widest

modes:
  - name: half
    aliases: [h]
    description: "Maps each terminal cell to the top and bottom halves of a 1x2 pixel block."
    renderer: halfblock_exact
    cell: { w: 1, h: 2 }
    glyph_sets: [half]
    colorer: top_bottom
    smart_step: terminal-column
    native_step: 1
    optimized: true

  - name: half/split
    aliases: [hs, split]
    description: "Chooses a two-colour half or side split that best matches each 2x2 pixel block."
    renderer: sparkline_half_split
    cell: { w: 2, h: 2 }
    glyph_sets: [half, side]
    colorer: fg_bg_sse
    smart_step: native
    native_step: 1
    optimized: true

  - name: quad
    aliases: [q]
    description: "Chooses half, side, or quadrant shapes that best match each 2x2 pixel block."
    renderer: quad_split_half
    cell: { w: 2, h: 2 }
    glyph_sets: [half, side, quad]
    colorer: top_bottom
    smart_step: native
    native_step: 1
    optimized: true

  - name: spark
    aliases: [s]
    description: "Chooses fractional vertical or horizontal sparkline fills for each 4x8 pixel block."
    renderer: sparkline_spark
    cell: { w: 4, h: 8 }
    glyph_sets: [half, side, spark_vertical, spark_horizontal]
    colorer: fg_bg_sse
    smart_step: native
    native_step: 1
    optimized: true

  - name: spark+quad
    aliases: [sq, qs]
    description: "Chooses sparkline, half, side, or quadrant shapes for each 4x8 pixel block."
    renderer: sparkline_spark_quad
    cell: { w: 4, h: 8 }
    glyph_sets: [half, side, quad, spark_vertical, spark_horizontal]
    colorer: fg_bg_sse
    smart_step: native
    native_step: 1
    optimized: true

  - name: 2x3
    aliases: ["6"]
    description: "Chooses one of 64 six-part masks for each 2x3 pixel block."
    renderer: sextant_2x3
    cell: { w: 2, h: 3 }
    glyph_sets: [six]
    colorer: fg_bg_sse
    smart_step: native
    native_step: 1
    optimized: true

  - name: six+half
    aliases: [xh, hx]
    description: "Chooses six-part, half, or side shapes for each 2x6 pixel block."
    renderer: sparkline_six_half
    cell: { w: 2, h: 6 }
    glyph_sets: [six, half]
    colorer: fg_bg_sse
    smart_step: native
    native_step: 1
    optimized: true

  - name: spark+six
    aliases: [sx, xs]
    description: "Chooses sparkline, half, side, or six-part shapes for each 4x24 pixel block."
    renderer: sparkline_spark_six
    cell: { w: 4, h: 24 }
    glyph_sets: [half, side, six, spark_vertical, spark_horizontal]
    colorer: fg_bg_sse
    smart_step: native
    native_step: 1
    optimized: true

  - name: octant
    aliases: [oct]
    description: "Chooses eight-part octant block characters (U+1CD00-U+1CDE5) for each 2x4 pixel block."
    renderer: glyph_union
    cell: { w: 2, h: 4 }
    glyph_sets: [octant]
    colorer: fg_bg_sse
    smart_step: native
    native_step: 1
    optimized: true

  - name: vec2
    description: "Chooses linear cell-split characters for 2x2 cell geometry."
    renderer: glyph_union
    cell: { w: 2, h: 2 }
    glyph_sets: [vec2]
    colorer: fg_bg_sse
    smart_step: native
    native_step: 1
    optimized: true

  - name: vec3
    description: "Chooses linear cell-split characters for 2x3 cell geometry."
    renderer: glyph_union
    cell: { w: 2, h: 3 }
    glyph_sets: [vec3]
    colorer: fg_bg_sse
    smart_step: native
    native_step: 1
    optimized: true

  - name: vec4
    description: "Chooses linear cell-split characters for 3x4 cell geometry."
    renderer: glyph_union
    cell: { w: 3, h: 4 }
    glyph_sets: [vec4]
    colorer: fg_bg_sse
    smart_step: native
    native_step: 1
    optimized: true

  - name: vec5
    description: "Chooses linear cell-split characters for 3x5 cell geometry."
    renderer: glyph_union
    cell: { w: 3, h: 5 }
    glyph_sets: [vec5]
    colorer: fg_bg_sse
    smart_step: native
    native_step: 1
    optimized: true

  - name: vec6
    aliases: [v, vec, vector]
    description: "Chooses linear cell-split characters (diagonals, triangles, half blocks) for 4x6 cell geometry."
    renderer: glyph_union
    cell: { w: 4, h: 6 }
    glyph_sets: [vec6]
    colorer: fg_bg_sse
    smart_step: native
    native_step: 1
    optimized: true

  - name: vec8
    description: "Chooses linear cell-split characters for 4x8 cell geometry."
    renderer: glyph_union
    cell: { w: 4, h: 8 }
    glyph_sets: [vec8]
    colorer: fg_bg_sse
    smart_step: native
    native_step: 1
    optimized: true

glyph_sets:
  braille: ["generated:braille_2x4"]
  half: [" ", "▀", "▄", "█"]
  side: ["▌", "▐"]
  quad: ["▘", "▝", "▖", "▗", "▚", "▞", "▛", "▜", "▙", "▟"]
  spark_vertical: ["▁", "▂", "▃", "▄", "▅", "▆", "▇", "█"]
  spark_horizontal: ["▏", "▎", "▍", "▌", "▋", "▊", "▉", "█"]
  six: ["generated:sextant_2x3_with_columns"]
  octant: ["generated:octant_2x4"]
  vec2: ["generated:vector_linear_splits"]
  vec3: ["generated:vector_linear_splits"]
  vec4: ["generated:vector_linear_splits"]
  vec5: ["generated:vector_linear_splits"]
  vec6: ["generated:vector_linear_splits"]
  vec8: ["generated:vector_linear_splits"]

colorers:
  top_bottom: half-block top/bottom foreground/background averages
  fg_bg_sse: two-color candidate search minimizing squared error

renderers:
  halfblock_exact: v1/halfblock
  quad_split_half: v1/quadblock SplitHalf
  sextant_2x3: v1/sextant
  sparkline_half_split: v1/sparkline HalfSplit
  sparkline_spark: v1/sparkline Spark
  sparkline_spark_quad: v1/sparkline SparkQuad
  sparkline_six_half: v1/sparkline SixHalf
  sparkline_spark_six: v1/sparkline SparkSix
  glyph_union: v1/sparkline Shapes

