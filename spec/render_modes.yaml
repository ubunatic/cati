# Exact, case-sensitive named unions. A name is resolved before '+' grammar.
composition_order: [full, half, quad, quad+, bars, bars+, six, 2x3, 3x3, all, all+, z, z+]
composition_info:
  full: "Uses empty and full cells at 1x1 geometry."
  half: "Uses full cells and top/bottom halves at 1x2 geometry."
  quad: "Combines full cells, sides, halves and quadrants at 2x2 geometry."
  quad+: "Adds quarter-height and split-middle approximations to quad at 2x4 geometry."
  bars: "Adds reduced horizontal and vertical bars to quad at 4x4 geometry."
  bars+: "Adds the non-hairline eighth bars to quad at 8x8 geometry."
  six: "Combines full cells, sides, halves, quadrants and sextants at 2x6 geometry."
  2x3: "Uses full cells, sides and native sextants at 2x3 geometry."
  3x3: "Combines native sextants with approximate 3x3 line shapes at actual 6x3 geometry."
  all: "Combines quad, sextant and approximate 3x3 families at 6x6 geometry."
  all+: "Adds reduced 4x4 bars to all at 12x12 geometry."
  z: "Adds non-hairline eighth bars to all at 24x24 geometry."
  z+: "Adds every eighth bar, including hairlines, to all at 24x24 geometry."
compositions:
  f: [0]
  full: [0]
  "1": [0]
  1x1: [0]
  h: [0, 2]
  half: [0, 2]
  "2": [0, 2]
  1x2: [0, 2]
  q: [0, 1, 2, 4]
  quad: [0, 1, 2, 4]
  "4": [0, 1, 2, 4]
  Q: [0, 1, 2, 4, 14, 15]
  quad+: [0, 1, 2, 4, 14, 15]
  b: [0, 1, 2, 4, 44]
  bars: [0, 1, 2, 4, 44]
  B: [0, 1, 2, 4, 86]
  bars+: [0, 1, 2, 4, 86]
  x: [0, 1, 2, 4, 6]
  six: [0, 1, 2, 4, 6]
  6: [0, 1, 6]
  2x3: [0, 1, 6]
  9: [0, 1, 6, 9]
  3x3: [0, 1, 6, 9]
  a: [0, 1, 2, 4, 6, 9]
  all: [0, 1, 2, 4, 6, 9]
  A: [0, 1, 2, 4, 6, 9, 44]
  all+: [0, 1, 2, 4, 6, 9, 44]
  z: [0, 1, 2, 4, 6, 9, 86]
  Z: [0, 1, 2, 4, 6, 9, 88]
  z+: [0, 1, 2, 4, 6, 9, 88]
