cycle:
  - half
  - half/split
  - quad
  - spark
  - spark+quad
  - six
  - six+half
  - spark+six

smart:
  metric: psnr
  max_reduction: 0.10
  step: native
  tie_break: widest

modes:
  - name: half
    aliases: [h]
    description: "Maps each terminal cell to the top and bottom halves of a 1x2 pixel block."
    renderer: halfblock_exact
    cell: { w: 1, h: 2 }
    glyph_sets: [half]
    colorer: top_bottom
    smart_step: terminal-column
    native_step: 1

  - name: half/split
    aliases: [hs, split]
    description: "Chooses a two-colour half or side split that best matches each 2x2 pixel block."
    renderer: sparkline_half_split
    cell: { w: 2, h: 2 }
    glyph_sets: [half, side]
    colorer: fg_bg_sse
    smart_step: native
    native_step: 1

  - name: quad
    aliases: [q]
    description: "Chooses half, side, or quadrant shapes that best match each 2x2 pixel block."
    renderer: quad_split_half
    cell: { w: 2, h: 2 }
    glyph_sets: [half, side, quad]
    colorer: top_bottom
    smart_step: native
    native_step: 1

  - name: spark
    aliases: [s]
    description: "Chooses fractional vertical or horizontal sparkline fills for each 4x8 pixel block."
    renderer: sparkline_spark
    cell: { w: 4, h: 8 }
    glyph_sets: [half, side, spark_vertical, spark_horizontal]
    colorer: fg_bg_sse
    smart_step: native
    native_step: 1

  - name: spark+quad
    aliases: [sq, qs]
    description: "Chooses sparkline, half, side, or quadrant shapes for each 4x8 pixel block."
    renderer: sparkline_spark_quad
    cell: { w: 4, h: 8 }
    glyph_sets: [half, side, quad, spark_vertical, spark_horizontal]
    colorer: fg_bg_sse
    smart_step: native
    native_step: 1

  - name: six
    aliases: [x]
    description: "Chooses one of 64 six-part masks for each 2x3 pixel block."
    renderer: sextant_2x3
    cell: { w: 2, h: 3 }
    glyph_sets: [six]
    colorer: fg_bg_sse
    smart_step: native
    native_step: 1

  - name: six+half
    aliases: [xh, hx]
    description: "Chooses six-part, half, or side shapes for each 2x6 pixel block."
    renderer: sparkline_six_half
    cell: { w: 2, h: 6 }
    glyph_sets: [six, half]
    colorer: fg_bg_sse
    smart_step: native
    native_step: 1

  - name: spark+six
    aliases: [sx, xs]
    description: "Chooses sparkline, half, side, or six-part shapes for each 4x24 pixel block."
    renderer: sparkline_spark_six
    cell: { w: 4, h: 24 }
    glyph_sets: [half, side, six, spark_vertical, spark_horizontal]
    colorer: fg_bg_sse
    smart_step: native
    native_step: 1

glyph_sets:
  half: [" ", "▀", "▄", "█"]
  side: ["▌", "▐"]
  quad: ["▘", "▝", "▖", "▗", "▚", "▞", "▛", "▜", "▙", "▟"]
  spark_vertical: ["▁", "▂", "▃", "▄", "▅", "▆", "▇", "█"]
  spark_horizontal: ["▏", "▎", "▍", "▌", "▋", "▊", "▉", "█"]
  six: ["generated:sextant_2x3_with_columns"]

colorers:
  top_bottom: half-block top/bottom foreground/background averages
  fg_bg_sse: two-color candidate search minimizing squared error

renderers:
  halfblock_exact: v1/halfblock
  quad_split_half: v1/quadblock SplitHalf
  sextant_2x3: v1/sextant
  sparkline_half_split: v1/sparkline HalfSplit
  sparkline_spark: v1/sparkline Spark
  sparkline_spark_quad: v1/sparkline SparkQuad
  sparkline_six_half: v1/sparkline SixHalf
  sparkline_spark_six: v1/sparkline SparkSix
