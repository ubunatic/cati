# yaml-language-server: $schema=../schemas/glyph_shapes.schema.json
$schema: ../schemas/glyph_shapes.schema.json
vector_shapes:
  points:
    UL: [0, 0]
    UC: [1/2, 0]
    UR: [1, 0]
    UML: [0, 1/3]
    LML: [0, 2/3]
    LL: [0, 1]
    LC: [1/2, 1]
    LR: [1, 1]
    UMR: [1, 1/3]
    LMR: [1, 2/3]
    C: [1/2, 1/2]
  glyphs:
    - { glyph: " " }                                       # U+0020 SPACE
    - { glyph: "█", rects: [[0, 0, 1, 1]] }                # U+2588 FULL BLOCK
    - { glyph: "▀", rects: [[0, 0, 1, 1/2]] }              # U+2580 UPPER HALF BLOCK
    - { glyph: "▄", invert: "▀" }                          # U+2584 LOWER HALF BLOCK
    - { glyph: "▌", rects: [[0, 0, 1/2, 1]] }              # U+258C LEFT HALF BLOCK
    - { glyph: "▐", invert: "▌" }                          # U+2590 RIGHT HALF BLOCK
    - { glyph: "┃", rects: [[1/4, 0, 3/4, 1]] }            # U+2503 BOX DRAWINGS HEAVY VERTICAL
    - { glyph: "🬋", rects: [[0, 1/3, 1, 2/3]] }            # U+1FB0B BLOCK SEXTANT-34
    - { glyph: "🬇", rects: [[1/2, 1/3, 1, 2/3]] }          # U+1FB07 BLOCK SEXTANT-4
    - glyph: "🬃"                                           # U+1FB03 BLOCK SEXTANT-3
      rects: [[0, 1/3, 1/2, 2/3]]
      masks:
        3x5: ["...",
              "...",
              "#..",
              "...",
              "..."]
    - { glyph: "🮂", rects: [[0, 0, 1, 1/4]] }              # U+1FB82 UPPER ONE QUARTER BLOCK
    - { glyph: "🮅", invert: "▂" }                          # U+1FB85 UPPER THREE QUARTERS BLOCK
    - { glyph: "▂", rects: [[0, 3/4, 1, 1]] }              # U+2582 LOWER ONE QUARTER BLOCK
    - { glyph: "▆", invert: "🮂" }                          # U+2586 LOWER THREE QUARTERS BLOCK
    # Eighth bars: with them every row boundary up to 8 rows has a straight edge,
    # e.g. at 4x6 🮂 snaps to 2 rows and ▔ gives the 1-row top edge. Listed after
    # the quarters so existing glyphs win when snapping makes masks identical.
    - { glyph: "▔", rects: [[0, 0, 1, 1/8]] }              # U+2594 UPPER ONE EIGHTH BLOCK
    - { glyph: "▇", invert: "▔" }                          # U+2587 LOWER SEVEN EIGHTHS BLOCK
    - { glyph: "🮃", rects: [[0, 0, 1, 3/8]] }              # U+1FB83 UPPER THREE EIGHTHS BLOCK
    - { glyph: "▅", invert: "🮃" }                          # U+2585 LOWER FIVE EIGHTHS BLOCK
    - { glyph: "▃", rects: [[0, 5/8, 1, 1]] }              # U+2583 LOWER THREE EIGHTHS BLOCK
    - { glyph: "🮄", invert: "▃" }                          # U+1FB84 UPPER FIVE EIGHTHS BLOCK
    - { glyph: "▁", rects: [[0, 7/8, 1, 1]] }              # U+2581 LOWER ONE EIGHTH BLOCK
    - { glyph: "🮆", invert: "▁" }                          # U+1FB86 UPPER SEVEN EIGHTHS BLOCK
    - { glyph: "▎", rects: [[0, 0, 1/4, 1]] }              # U+258E LEFT ONE QUARTER BLOCK
    - { glyph: "▊", invert: "🮇" }                          # U+258A LEFT THREE QUARTERS BLOCK
    - { glyph: "🮇", rects: [[3/4, 0, 1, 1]] }              # U+1FB87 RIGHT ONE QUARTER BLOCK
    - { glyph: "🮊", invert: "▎" }                          # U+1FB8A RIGHT THREE QUARTERS BLOCK
    - { glyph: "▖", rects: [[0, 1/2, 1/2, 1]] }            # U+2596 QUADRANT LOWER LEFT
    - { glyph: "▗", rects: [[1/2, 1/2, 1, 1]] }            # U+2597 QUADRANT LOWER RIGHT
    - { glyph: "▘", rects: [[0, 0, 1/2, 1/2]] }            # U+2598 QUADRANT UPPER LEFT
    - { glyph: "▙", invert: "▝" }                          # U+2599 QUADRANT UPPER LEFT AND LOWER LEFT AND LOWER RIGHT
    - { glyph: "▚", rects: [[0, 0, 1/2, 1/2], [1/2, 1/2, 1, 1]] } # U+259A QUADRANT UPPER LEFT AND LOWER RIGHT
    - { glyph: "▛", invert: "▗" }                          # U+259B QUADRANT UPPER LEFT AND UPPER RIGHT AND LOWER LEFT
    - { glyph: "▜", invert: "▖" }                          # U+259C QUADRANT UPPER LEFT AND UPPER RIGHT AND LOWER RIGHT
    - { glyph: "▝", rects: [[1/2, 0, 1, 1/2]] }            # U+259D QUADRANT UPPER RIGHT
    - { glyph: "▞", rects: [[1/2, 0, 1, 1/2], [0, 1/2, 1/2, 1]] } # U+259E QUADRANT UPPER RIGHT AND LOWER LEFT
    - { glyph: "▟", invert: "▘" }                          # U+259F QUADRANT UPPER RIGHT AND LOWER LEFT AND LOWER RIGHT
    - { glyph: "🮚", polys: [[UL, UR, C], [LL, C, LR]] }    # U+1FB9A UPPER AND LOWER TRIANGULAR HALF BLOCK
    - { glyph: "🮛", invert: "🮚" }                          # U+1FB9B LEFT AND RIGHT TRIANGULAR HALF BLOCK
    - { glyph: "🬼", split: [LML, LC, LL] }                 # U+1FB3C LOWER LEFT BLOCK DIAGONAL LOWER MIDDLE LEFT TO LOWER CENTRE
    - glyph: "🬽"                                           # U+1FB3D LOWER LEFT BLOCK DIAGONAL LOWER MIDDLE LEFT TO LOWER RIGHT
      split: [LML, LR, LL]
      masks:
        3x5: ["...",
              "...",
              "...",
              "#..",
              "##."]
    - glyph: "🬾"                                           # U+1FB3E LOWER LEFT BLOCK DIAGONAL UPPER MIDDLE LEFT TO LOWER CENTRE
      split: [UML, LC, LL]
      masks:
        3x5: ["...",
              "...",
              "#..",
              "#..",
              "#.."]
    - { glyph: "🬿", split: [UML, LR, LL] }                 # U+1FB3F LOWER LEFT BLOCK DIAGONAL UPPER MIDDLE LEFT TO LOWER RIGHT
    - glyph: "🭀"                                           # U+1FB40 LOWER LEFT BLOCK DIAGONAL UPPER LEFT TO LOWER CENTRE
      split: [UL, LC, LL]
      masks:
        3x5: ["...",
              "#..",
              "#..",
              "#..",
              "##."]
    - { glyph: "🭁", split: [UML, UC, LR] }                 # U+1FB41 LOWER RIGHT BLOCK DIAGONAL UPPER MIDDLE LEFT TO UPPER CENTRE
    - { glyph: "🭂", split: [UML, UR, LR] }                 # U+1FB42 LOWER RIGHT BLOCK DIAGONAL UPPER MIDDLE LEFT TO UPPER RIGHT
    - { glyph: "🭃", split: [LML, UC, LR] }                 # U+1FB43 LOWER RIGHT BLOCK DIAGONAL LOWER MIDDLE LEFT TO UPPER CENTRE
    - glyph: "🭄"                                           # U+1FB44 LOWER RIGHT BLOCK DIAGONAL LOWER MIDDLE LEFT TO UPPER RIGHT
      split: [LML, UR, LR]
      masks:
        3x5: ["..#",
              ".##",
              ".##",
              "###",
              "###"]
    - { glyph: "🭅", split: [LL, UC, LR] }                  # U+1FB45 LOWER RIGHT BLOCK DIAGONAL LOWER LEFT TO UPPER CENTRE
    - glyph: "🭆"                                           # U+1FB46 LOWER RIGHT BLOCK DIAGONAL LOWER MIDDLE LEFT TO UPPER MIDDLE RIGHT
      split: [LML, UMR, LR]
      masks:
        3x5: ["...",
              "...",
              ".##",
              "###",
              "###"]
    - { glyph: "🭇", split: [LC, LMR, LR] }                 # U+1FB47 LOWER RIGHT BLOCK DIAGONAL LOWER CENTRE TO LOWER MIDDLE RIGHT
    - glyph: "🭈"                                           # U+1FB48 LOWER RIGHT BLOCK DIAGONAL LOWER LEFT TO LOWER MIDDLE RIGHT
      split: [LL, LMR, LR]
      masks:
        3x5: ["...",
              "...",
              "...",
              "..#",
              ".##"]
    - glyph: "🭉"                                           # U+1FB49 LOWER RIGHT BLOCK DIAGONAL LOWER CENTRE TO UPPER MIDDLE RIGHT
      split: [LC, UMR, LR]
      masks:
        3x5: ["...",
              "...",
              "..#",
              "..#",
              "..#"]
    - { glyph: "🭊", split: [LL, UMR, LR] }                 # U+1FB4A LOWER RIGHT BLOCK DIAGONAL LOWER LEFT TO UPPER MIDDLE RIGHT
    - glyph: "🭋"                                           # U+1FB4B LOWER RIGHT BLOCK DIAGONAL LOWER CENTRE TO UPPER RIGHT
      split: [LC, UR, LR]
      masks:
        3x5: ["...",
              "..#",
              "..#",
              "..#",
              ".##"]
    - { glyph: "🭌", split: [UC, UMR, LL] }                 # U+1FB4C LOWER LEFT BLOCK DIAGONAL UPPER CENTRE TO UPPER MIDDLE RIGHT
    - { glyph: "🭍", split: [UL, UMR, LL] }                 # U+1FB4D LOWER LEFT BLOCK DIAGONAL UPPER LEFT TO UPPER MIDDLE RIGHT
    - { glyph: "🭎", split: [UC, LMR, LL] }                 # U+1FB4E LOWER LEFT BLOCK DIAGONAL UPPER CENTRE TO LOWER MIDDLE RIGHT
    - glyph: "🭏"                                           # U+1FB4F LOWER LEFT BLOCK DIAGONAL UPPER LEFT TO LOWER MIDDLE RIGHT
      split: [UL, LMR, LL]
      masks:
        3x5: ["#..",
              "##.",
              "##.",
              "###",
              "###"]
    - { glyph: "🭐", split: [UC, LR, LL] }                  # U+1FB50 LOWER LEFT BLOCK DIAGONAL UPPER CENTRE TO LOWER RIGHT
    - { glyph: "🭑", split: [UML, LMR, LL] }                # U+1FB51 LOWER LEFT BLOCK DIAGONAL UPPER MIDDLE LEFT TO LOWER MIDDLE RIGHT
    - { glyph: "🭒", invert: "🬼" }                          # U+1FB52 UPPER RIGHT BLOCK DIAGONAL LOWER MIDDLE LEFT TO LOWER CENTRE
    - { glyph: "🭓", invert: "🬽" }                          # U+1FB53 UPPER RIGHT BLOCK DIAGONAL LOWER MIDDLE LEFT TO LOWER RIGHT
    - { glyph: "🭔", invert: "🬾" }                          # U+1FB54 UPPER RIGHT BLOCK DIAGONAL UPPER MIDDLE LEFT TO LOWER CENTRE
    - glyph: "🭕"                                           # U+1FB55 UPPER RIGHT BLOCK DIAGONAL UPPER MIDDLE LEFT TO LOWER RIGHT
      invert: "🬿"
      masks:
        3x5: ["###",
              "###",
              ".##",
              ".##",
              "..#"]
    - { glyph: "🭖", invert: "🭀" }                          # U+1FB56 UPPER RIGHT BLOCK DIAGONAL UPPER LEFT TO LOWER CENTRE
    - { glyph: "🭗", invert: "🭁" }                          # U+1FB57 UPPER LEFT BLOCK DIAGONAL UPPER MIDDLE LEFT TO UPPER CENTRE
    - glyph: "🭘"                                           # U+1FB58 UPPER LEFT BLOCK DIAGONAL UPPER MIDDLE LEFT TO UPPER RIGHT
      invert: "🭂"
      masks:
        3x5: ["##.",
              "#..",
              "...",
              "...",
              "..."]
    - glyph: "🭙"                                           # U+1FB59 UPPER LEFT BLOCK DIAGONAL LOWER MIDDLE LEFT TO UPPER CENTRE
      invert: "🭃"
      masks:
        3x5: ["#..",
              "#..",
              "#..",
              "...",
              "..."]
    - glyph: "🭚"                                           # U+1FB5A UPPER LEFT BLOCK DIAGONAL LOWER MIDDLE LEFT TO UPPER RIGHT
      invert: "🭄"
      masks:
        3x5: ["###",
              "##.",
              "#..",
              "...",
              "..."]
    - glyph: "🭛"                                           # U+1FB5B UPPER LEFT BLOCK DIAGONAL LOWER LEFT TO UPPER CENTRE
      invert: "🭅"
      masks:
        3x5: ["##.",
              "#..",
              "#..",
              "#..",
              "..."]
    - glyph: "🭜"                                           # U+1FB5C UPPER LEFT BLOCK DIAGONAL LOWER MIDDLE LEFT TO UPPER MIDDLE RIGHT
      invert: "🭆"
      masks:
        3x5: ["###",
              "###",
              "##.",
              "...",
              "..."]
    - { glyph: "🭝", invert: "🭇" }                          # U+1FB5D UPPER LEFT BLOCK DIAGONAL LOWER CENTRE TO LOWER MIDDLE RIGHT
    - { glyph: "🭞", invert: "🭈" }                          # U+1FB5E UPPER LEFT BLOCK DIAGONAL LOWER LEFT TO LOWER MIDDLE RIGHT
    - { glyph: "🭟", invert: "🭉" }                          # U+1FB5F UPPER LEFT BLOCK DIAGONAL LOWER CENTRE TO UPPER MIDDLE RIGHT
    - glyph: "🭠"                                           # U+1FB60 UPPER LEFT BLOCK DIAGONAL LOWER LEFT TO UPPER MIDDLE RIGHT
      invert: "🭊"
      masks:
        3x5: ["###",
              "###",
              "##.",
              "##.",
              "#.."]
    - { glyph: "🭡", invert: "🭋" }                          # U+1FB61 UPPER LEFT BLOCK DIAGONAL LOWER CENTRE TO UPPER RIGHT
    - { glyph: "🭢", invert: "🭌" }                          # U+1FB62 UPPER RIGHT BLOCK DIAGONAL UPPER CENTRE TO UPPER MIDDLE RIGHT
    - glyph: "🭣"                                           # U+1FB63 UPPER RIGHT BLOCK DIAGONAL UPPER LEFT TO UPPER MIDDLE RIGHT
      invert: "🭍"
      masks:
        3x5: [".##",
              "..#",
              "...",
              "...",
              "..."]
    - glyph: "🭤"                                           # U+1FB64 UPPER RIGHT BLOCK DIAGONAL UPPER CENTRE TO LOWER MIDDLE RIGHT
      invert: "🭎"
      masks:
        3x5: ["..#",
              "..#",
              "..#",
              "...",
              "..."]
    - glyph: "🭥"                                           # U+1FB65 UPPER RIGHT BLOCK DIAGONAL UPPER LEFT TO LOWER MIDDLE RIGHT
      invert: "🭏"
      masks:
        3x5: ["###",
              ".##",
              "..#",
              "...",
              "..."]
    - glyph: "🭦"                                           # U+1FB66 UPPER RIGHT BLOCK DIAGONAL UPPER CENTRE TO LOWER RIGHT
      invert: "🭐"
      masks:
        3x5: [".##",
              "..#",
              "..#",
              "..#",
              "..."]
    - { glyph: "🭧", invert: "🭑" }                          # U+1FB67 UPPER RIGHT BLOCK DIAGONAL UPPER MIDDLE LEFT TO LOWER MIDDLE RIGHT
    - { glyph: "🭨", invert: "🭬" }                          # U+1FB68 UPPER AND RIGHT AND LOWER TRIANGULAR THREE QUARTERS BLOCK
    - { glyph: "🭩", invert: "🭭" }                          # U+1FB69 LEFT AND LOWER AND RIGHT TRIANGULAR THREE QUARTERS BLOCK
    - { glyph: "🭪", invert: "🭮" }                          # U+1FB6A UPPER AND LEFT AND LOWER TRIANGULAR THREE QUARTERS BLOCK
    - { glyph: "🭫", invert: "🭯" }                          # U+1FB6B LEFT AND UPPER AND RIGHT TRIANGULAR THREE QUARTERS BLOCK
    - glyph: "🭬"                                           # U+1FB6C LEFT TRIANGULAR ONE QUARTER BLOCK
      polys: [[UL, C, LL]]
      masks:
        3x5: ["...",
              "#..",
              "##.",
              "#..",
              "..."]
    - { glyph: "🭭", polys: [[UL, UR, C]] }                 # U+1FB6D UPPER TRIANGULAR ONE QUARTER BLOCK
    - glyph: "🭮"                                           # U+1FB6E RIGHT TRIANGULAR ONE QUARTER BLOCK
      polys: [[UR, LR, C]]
      masks:
        3x5: ["...",
              "..#",
              ".##",
              "..#",
              "..."]
    - { glyph: "🭯", polys: [[LL, C, LR]] }                 # U+1FB6F LOWER TRIANGULAR ONE QUARTER BLOCK
